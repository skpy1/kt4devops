name: Docker Publish

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          version=$(cat version)
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ci_cd_project:$version .
          docker push ${{ secrets.DOCKER_USERNAME }}/ci_cd_project:$version